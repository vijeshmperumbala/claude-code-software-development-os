name: Validate Software Development OS
on:
  push:
  pull_request:
jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate package structure and references
        run: python scripts/validate_os.py
